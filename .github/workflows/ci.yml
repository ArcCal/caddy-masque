# Tests every push to main and every pull request, and builds Caddy with
# the module for Linux on x86_64 and arm64 only. For a published GitHub
# Release, the builds are attached to it once every test has passed; a run
# started by hand with the tag of an existing release builds and attaches
# that tag's code the same way (for a release whose own run failed).
#
# The end-to-end test needs masque-vpn's client, from the private
# ArcCal/masque-vpn repository: it runs when the repository secret
# MASQUE_VPN_TOKEN holds a token that can read it. Without that secret it is
# skipped with a warning, and builds and release uploads go ahead.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release to build and attach the builds to (empty: build main only)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-go@v7
        with:
          # The newest patch release of the line go.mod asks for: it carries the
          # standard library security fixes (go.mod says 1.26.0, the first release).
          go-version: "1.26"
          check-latest: true
      - name: Dependencies match go.sum
        run: go mod verify
      - name: Verify pinned HTTP/2 reset patch
        run: python3 tests/verify-http2-fork.py
      - name: gofmt
        run: test -z "$(git ls-files '*.go' ':!third_party/**' | xargs gofmt -l | tee /dev/stderr)"
      - run: go vet ./...
      - name: Reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Unit and in-process tests (with the race detector)
        run: go test -race -count=1 ./...
      - name: Capsule stream segmentation fuzzing
        run: go test ./internal/proto -run '^$' -fuzz '^FuzzCapsuleStream$' -fuzztime=30s -parallel=2
      - name: Upstream HTTP/2 and HPACK tests for the patched dependency
        working-directory: third_party/xnet
        run: go test -race ./http2 ./http2/hpack

  e2e:
    name: end-to-end with masque-client (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      HAVE_CLIENT: ${{ secrets.MASQUE_VPN_TOKEN != '' }}
    steps:
      - name: Skipped without MASQUE_VPN_TOKEN
        if: env.HAVE_CLIENT != 'true'
        run: |
          echo "::warning::the end-to-end test with masque-client was skipped: set the MASQUE_VPN_TOKEN secret to a token that can read ArcCal/masque-vpn"
      - uses: actions/checkout@v7
        if: env.HAVE_CLIENT == 'true'
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.event.pull_request.head.sha || github.ref }}
      - uses: actions/checkout@v7
        if: env.HAVE_CLIENT == 'true'
        with:
          persist-credentials: false
          repository: ArcCal/masque-vpn
          token: ${{ secrets.MASQUE_VPN_TOKEN }}
          path: masque-vpn
      - uses: actions/setup-go@v7
        if: env.HAVE_CLIENT == 'true'
        with:
          # The newest patch release of the line go.mod asks for: it carries the
          # standard library security fixes (go.mod says 1.26.0, the first release).
          go-version: "1.26"
          check-latest: true
      - uses: dtolnay/rust-toolchain@1.99.0
        if: env.HAVE_CLIENT == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.HAVE_CLIENT == 'true'
        with:
          workspaces: masque-vpn
      - name: Build
        if: env.HAVE_CLIENT == 'true'
        run: |
          CGO_ENABLED=0 go build -trimpath -o caddy ./cmd/caddy
          CGO_ENABLED=0 go build -o netsim ./tests/netsim
          cargo build --locked --release --manifest-path masque-vpn/Cargo.toml --bin masque-client
      - name: End-to-end test in network namespaces
        if: env.HAVE_CLIENT == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q iperf3 nftables
          sudo CADDY="$PWD/caddy" CLIENT_BIN="$PWD/masque-vpn/target/release/masque-client" NETSIM="$PWD/netsim" tests/e2e-netns.sh

  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-go@v7
        with:
          # The newest patch release of the line go.mod asks for: it carries the
          # standard library security fixes (go.mod says 1.26.0, the first release).
          go-version: "1.26"
          check-latest: true
      - name: Build
        id: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version=${TAG#v}
          [ -n "$TAG" ] || version=$(git rev-parse --short HEAD)
          name=caddy-masque-$version-${{ matrix.os }}-${{ matrix.arch }}
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w" -o "dist/$name/caddy" ./cmd/caddy
          # The program is for the platform in its name, and records the
          # commit it was built from (`caddy build-info`).
          case ${{ matrix.arch }} in amd64) machine=x86-64 ;; arm64) machine="ARM aarch64" ;; esac
          kind=$(file -b "dist/$name/caddy")
          echo "$kind"
          grep -q "^ELF 64-bit LSB executable, $machine, .*statically linked" <<<"$kind"
          info=$RUNNER_TEMP/build-info.txt
          go version -m "dist/$name/caddy" >"$info"
          grep -qP '^\tbuild\tGOOS=${{ matrix.os }}$' "$info"
          grep -qP '^\tbuild\tGOARCH=${{ matrix.arch }}$' "$info"
          grep -qP "^\tbuild\tvcs.revision=$(git rev-parse HEAD)$" "$info"
          cp -r deploy README.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          (cd dist && sha256sum "$name.tar.gz" >"$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: attach to the release
    if: github.event_name == 'release' || inputs.tag != ''
    needs: [test, e2e, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # for the build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Signed (Sigstore) statement of which workflow run built each archive:
      # verify with `gh attestation verify FILE --repo ArcCal/caddy-masque`.
      # GitHub offers attestations to public repositories only (a private
      # repository of a personal account gets "Feature not available"), so
      # a private repository's release goes without.
      - name: Both archives, intact
        working-directory: dist
        run: |
          ls -l
          archives=(*.tar.gz) sums=(*.tar.gz.sha256)
          test "${#archives[@]}" -eq 2
          test "${#sums[@]}" -eq 2
          sha256sum -c -- *.sha256
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*.tar.gz
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
