# Tests every push to main and every pull request, and builds Caddy with
# the module for Linux on x86_64 and arm64 only, each on its own native
# runner. For a published GitHub
# Release, the builds are attached to it once every test has passed; a run
# started by hand with the tag of an existing release builds and attaches
# that tag's code the same way (for a release whose own run failed).
#
# End-to-end tests use ArcCal/masque-vpn. Public checkouts use the job token;
# private checkouts require MASQUE_VPN_TOKEN with read access. Checkout or
# test failure prevents artifact uploads.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release to build and attach the builds to (empty: build main only)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      tag: ${{ inputs.tag || '' }}
    secrets:
      MASQUE_VPN_TOKEN: ${{ secrets.MASQUE_VPN_TOKEN }}

  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    needs: validate
    # Each architecture is built on its own native runner, so the program
    # can also be run there before it is packaged.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          # The newest patch release of the line go.mod asks for: it carries the
          # standard library security fixes (go.mod says 1.26.0, the first release).
          go-version: "1.26"
          check-latest: true
      - uses: actions/download-artifact@v8
        with:
          name: tested-caddy-${{ matrix.os }}-${{ matrix.arch }}
          path: tested
      - name: Package the tested executable
        id: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # Any release tag gets its builds; the archive name carries the tag.
          version=${TAG#v}
          version=${version//\//-}
          [ -n "$TAG" ] || version=$(git rev-parse --short HEAD)
          name=caddy-masque-$version-${{ matrix.os }}-${{ matrix.arch }}
          mkdir -p "dist/$name"
          (cd tested && sha256sum -c caddy.sha256)
          cp tested/caddy "dist/$name/caddy"
          cp tested/caddy.sha256 "dist/$name/caddy.sha256"
          chmod +x "dist/$name/caddy"
          # The program is for the platform in its name, and records the
          # commit it was built from (`caddy build-info`).
          case ${{ matrix.arch }} in amd64) machine=x86-64 ;; arm64) machine="ARM aarch64" ;; esac
          kind=$(file -b "dist/$name/caddy")
          echo "$kind"
          grep -q "^ELF 64-bit LSB executable, $machine, .*statically linked" <<<"$kind"
          info=$RUNNER_TEMP/build-info.txt
          go version -m "dist/$name/caddy" >"$info"
          grep -qP '^\tbuild\tGOOS=${{ matrix.os }}$' "$info"
          grep -qP '^\tbuild\tGOARCH=${{ matrix.arch }}$' "$info"
          grep -qP "^\tbuild\tvcs.revision=$(git rev-parse HEAD)$" "$info"
          # It runs on its architecture and has the MASQUE app and handler.
          "dist/$name/caddy" version
          "dist/$name/caddy" list-modules >"$RUNNER_TEMP/modules.txt"
          for module in masque http.handlers.masque dns.providers.cloudflare; do
            grep -qFx "$module" "$RUNNER_TEMP/modules.txt"
          done
          cp -r deploy README.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          (cd dist && sha256sum "$name.tar.gz" >"$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: attach to the release
    if: github.event_name == 'release' || inputs.tag != ''
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # for the build provenance attestation
      attestations: write
    steps:
      # The same ref the builds checked out, to record its commit.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.event.pull_request.head.sha || github.sha }}
          path: source
      - uses: actions/download-artifact@v8
        with:
          pattern: caddy-masque-*
          path: dist
          merge-multiple: true
      # Signed (Sigstore) statement of which workflow run built each archive:
      # verify with `gh attestation verify FILE --repo ArcCal/caddy-masque`.
      # GitHub offers attestations to public repositories only (a private
      # repository of a personal account gets "Feature not available"), so
      # a private repository's release goes without.
      - name: Both archives, intact
        working-directory: dist
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          ls -l
          archives=(*.tar.gz) sums=(*.tar.gz.sha256)
          test "${#archives[@]}" -eq 2
          test "${#sums[@]}" -eq 2
          sha256sum -c -- *.sha256
          # Any tag gets the builds; record which tag and commit they came from.
          commit=$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)
          {
            printf 'Release tag: %s\nSource commit: %s\n' "$TAG" "$commit"
            printf 'Workflow run: %s/%s/actions/runs/%s\n\nSHA-256:\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            cat -- *.sha256
          } > RELEASE-MANIFEST.txt
          cat RELEASE-MANIFEST.txt
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*.tar.gz
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
