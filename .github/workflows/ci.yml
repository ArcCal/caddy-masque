# Tests every push to main and every pull request, and builds Caddy with
# the module for Linux on x86_64 and arm64 and macOS on Apple silicon. For a
# published GitHub Release,
# the builds are attached to it.
#
# The end-to-end test needs masque-vpn's client, from the private
# ArcCal/masque-vpn repository: it runs when the repository secret
# MASQUE_VPN_TOKEN holds a token that can read it, and is skipped otherwise.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-go@v5
        with:
          # The newest patch release of the line go.mod asks for: it carries the
          # standard library security fixes (go.mod says 1.26.0, the first release).
          go-version: "1.26"
          check-latest: true
      - name: Dependencies match go.sum
        run: go mod verify
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - name: Unit and in-process tests (with the race detector)
        run: go test -race -count=1 ./...

  e2e:
    name: end-to-end with masque-client
    runs-on: ubuntu-24.04
    env:
      HAVE_CLIENT: ${{ secrets.MASQUE_VPN_TOKEN != '' }}
    steps:
      - name: Skipped without MASQUE_VPN_TOKEN
        if: env.HAVE_CLIENT != 'true'
        run: echo "::notice::the end-to-end test needs the MASQUE_VPN_TOKEN secret to fetch masque-vpn's client"
      - uses: actions/checkout@v5
        if: env.HAVE_CLIENT == 'true'
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/checkout@v5
        if: env.HAVE_CLIENT == 'true'
        with:
          persist-credentials: false
          repository: ArcCal/masque-vpn
          token: ${{ secrets.MASQUE_VPN_TOKEN }}
          path: masque-vpn
      - uses: actions/setup-go@v5
        if: env.HAVE_CLIENT == 'true'
        with:
          # The newest patch release of the line go.mod asks for: it carries the
          # standard library security fixes (go.mod says 1.26.0, the first release).
          go-version: "1.26"
          check-latest: true
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAVE_CLIENT == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.HAVE_CLIENT == 'true'
        with:
          workspaces: masque-vpn
      - name: Build
        if: env.HAVE_CLIENT == 'true'
        run: |
          go build -o caddy ./cmd/caddy
          cargo build --manifest-path masque-vpn/Cargo.toml --bin masque-client
      - name: End-to-end test in network namespaces
        if: env.HAVE_CLIENT == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q iperf3 nftables
          sudo CADDY="$PWD/caddy" CLIENT_BIN="$PWD/masque-vpn/target/debug/masque-client" tests/e2e-netns.sh

  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: arm64 }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-go@v5
        with:
          # The newest patch release of the line go.mod asks for: it carries the
          # standard library security fixes (go.mod says 1.26.0, the first release).
          go-version: "1.26"
          check-latest: true
      - name: Build
        id: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          version=${GITHUB_REF_NAME#v}
          [ "$GITHUB_REF_TYPE" = tag ] || version=$(git rev-parse --short HEAD)
          name=caddy-masque-$version-${{ matrix.os }}-${{ matrix.arch }}
          mkdir -p dist/$name
          go build -trimpath -ldflags "-s -w" -o dist/$name/caddy ./cmd/caddy
          cp -r deploy README.md dist/$name/
          tar -czf dist/$name.tar.gz -C dist $name
          (cd dist && sha256sum $name.tar.gz > $name.tar.gz.sha256)
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: 30

  release:
    name: attach to the release
    if: github.event_name == 'release'
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # for the build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Signed (Sigstore) statement of which workflow run built each archive:
      # verify with `gh attestation verify FILE --repo ArcCal/caddy-masque`.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "$GITHUB_REPOSITORY"
