# Shared required validation; no release publishing permissions.
name: validate

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
        default: ""
    secrets:
      MASQUE_VPN_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  test:
    name: test (Go ${{ matrix.go }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          # Exercise both supported toolchains without additional build tags.
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Dependencies match go.sum
        run: go mod verify
      - name: Verify pinned HTTP/2 reset patch
        run: python3 tests/verify-http2-fork.py
      - name: Verify pinned HTTP/3 datagram rejection patch
        run: python3 tests/verify-http3-fork.py
      - name: gofmt
        run: test -z "$(git ls-files '*.go' ':!third_party/**' | xargs gofmt -l | tee /dev/stderr)"
      - run: go vet ./...
      - name: Reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Upstream versions behind local transport replacements
        run: python3 tests/check-transport-vulnerabilities.py
      - name: Required HTTP/2 security regressions
        run: python3 tests/test-http2-security.py
      - name: Unit and in-process tests (with the race detector)
        run: go test -race -count=1 ./...
      - name: Required nftables ruleset checks
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q nftables
          go test -race -c -o "$RUNNER_TEMP/hostnet.test" ./internal/hostnet
          sudo "$RUNNER_TEMP/hostnet.test" -test.run '^TestRuleset$' -test.v | tee "$RUNNER_TEMP/hostnet.log"
          grep -q '^--- PASS: TestRuleset' "$RUNNER_TEMP/hostnet.log"
          ! grep -q -- '--- SKIP:' "$RUNNER_TEMP/hostnet.log"
      - name: Capsule stream segmentation fuzzing
        run: go test ./internal/proto -run '^$' -fuzz '^FuzzCapsuleStream$' -fuzztime=30s -parallel=2
      - name: Upstream HTTP/2 and HPACK tests for the patched dependency
        working-directory: third_party/xnet
        run: go test -race ./http2 ./http2/hpack ./internal/httpcommon
      - name: Upstream HTTP/3 tests for the patched dependency
        working-directory: third_party/quic-go
        run: go test -race ./http3/...
      - name: Patched QUIC transport regressions
        working-directory: third_party/quic-go
        run: |
          go test . ./internal/ackhandler ./internal/congestion ./internal/wire
          # The baseline allocation-count assertion is instrument-sensitive;
          # it runs above without race instrumentation. Keep all functional cases.
          go test -race -skip '^TestFrameParserAllocs$' . ./internal/ackhandler ./internal/congestion ./internal/wire

  e2e:
    name: end-to-end with masque-client (Go ${{ matrix.go }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      HAVE_CLIENT: ${{ secrets.MASQUE_VPN_TOKEN != '' }}
      TRUSTED_SOURCE: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Require authenticated client checkout for interoperability tests
        if: env.HAVE_CLIENT != 'true' || env.TRUSTED_SOURCE != 'true'
        run: |
          echo "::error::required interoperability tests cannot run: MASQUE_VPN_TOKEN must read ArcCal/masque-vpn, and fork pull requests need validation from a trusted repository branch"
          exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ArcCal/masque-vpn
          token: ${{ secrets.MASQUE_VPN_TOKEN }}
          path: masque-vpn
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: masque-vpn
      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o caddy ./cmd/caddy
          sha256sum caddy > caddy.sha256
          ./caddy list-modules > "$RUNNER_TEMP/modules.txt"
          for module in masque http.handlers.masque dns.providers.cloudflare; do
            grep -qFx "$module" "$RUNNER_TEMP/modules.txt"
          done
          CGO_ENABLED=0 go build -o netsim ./tests/netsim
          cargo build --locked --release --manifest-path masque-vpn/Cargo.toml --bin masque-client
      - name: masque-client against Caddy in process, IPv4 and IPv6 over every transport and datagram mode
        run: |
          set -euo pipefail
          MASQUE_CLIENT="$PWD/masque-vpn/target/release/masque-client" go test -count=1 -run '^TestInteropMasqueClient$' -v . | tee "$RUNNER_TEMP/client-interop.log"
          for transport in h3 h2 http1.1 h3-capsules; do
            grep -q "^    --- PASS: TestInteropMasqueClient/$transport " "$RUNNER_TEMP/client-interop.log"
          done
          ! grep -q -- '--- SKIP' "$RUNNER_TEMP/client-interop.log"
      - name: Current Mac and Killswitch protocol cores against Caddy
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$PWD/masque-vpn/target" python3 tests/run-client-wrapper-interop.py \
            --masque-vpn-root "$PWD/masque-vpn" --release | tee "$RUNNER_TEMP/wrapper-interop.log"
      - name: End-to-end test in network namespaces
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q iperf3 nftables
          sudo REQUIRE_ALL_TESTS=1 CADDY="$PWD/caddy" CLIENT_BIN="$PWD/masque-vpn/target/release/masque-client" NETSIM="$PWD/netsim" tests/e2e-netns.sh | tee "$RUNNER_TEMP/masque-e2e.log"
          if ! grep -Eq '^[1-9][0-9]* passed, 0 failed, 0 skipped$' "$RUNNER_TEMP/masque-e2e.log"; then
            echo "::error::required interoperability tests must report passing checks with no failures or skips"
            exit 1
          fi
      # masque-vpn's wire-level probe builds requests, capsules and datagrams
      # itself, so this server is checked against RFC 9484 and RFC 9297 by
      # a program that is neither project's client.
      - name: Wire-level conformance with masque-vpn's probe
        run: |
          set -euo pipefail
          go -C masque-vpn/interop build -mod=readonly -o "$RUNNER_TEMP/conformance" ./conformance
          sudo REQUIRE_ALL_TESTS=1 SERVER_KIND=caddy CADDY="$PWD/caddy" PROBE="$RUNNER_TEMP/conformance" \
            masque-vpn/tests/conformance.sh | tee "$RUNNER_TEMP/conformance.log"
          grep -Eq '^[1-9][0-9]* passed, 0 failed, 0 skipped$' "$RUNNER_TEMP/conformance.log"
      # Promote exactly the Go 1.26 executable that passed the kernel and wire
      # gates. Packaging workflows verify its checksum and never rebuild it.
      - name: Verify tested executable unchanged
        run: sha256sum -c caddy.sha256
      - name: Upload tested executable for packaging
        if: matrix.go == '1.26'
        uses: actions/upload-artifact@v7
        with:
          name: tested-caddy-linux-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
          path: |
            caddy
            caddy.sha256
          if-no-files-found: error
          retention-days: 1
