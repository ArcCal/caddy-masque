name: Build Caddy with MASQUE and Cloudflare

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Linux CPU architecture
        type: choice
        required: true
        default: amd64
        options:
          - amd64
          - arm64

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    secrets:
      MASQUE_VPN_TOKEN: ${{ secrets.MASQUE_VPN_TOKEN }}

  build:
    name: Package tested Linux ${{ inputs.arch }}
    needs: validate
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      - uses: actions/download-artifact@v8
        with:
          name: tested-caddy-linux-${{ inputs.arch }}
          path: tested
      # The default build now includes Cloudflare. Reuse the exact executable
      # that passed validate.yml's kernel and wire interoperability gates.
      - name: Package validated MASQUE and Cloudflare modules
        shell: bash
        run: |
          set -euo pipefail
          (cd tested && sha256sum -c caddy.sha256)
          name=caddy-masque-cloudflare-linux-${{ inputs.arch }}
          mkdir -p "dist/$name"
          cp tested/caddy "dist/$name/caddy"
          cp tested/caddy.sha256 "dist/$name/caddy.sha256"
          chmod +x "dist/$name/caddy"
          binary="dist/$name/caddy"
          "$binary" version
          "$binary" list-modules > "$RUNNER_TEMP/modules.txt"
          for module in masque http.handlers.masque dns.providers.cloudflare; do
            grep -Fx "$module" "$RUNNER_TEMP/modules.txt"
          done
          go version -m "$binary" > "dist/$name/build-info.txt"
          grep -qP '^\tbuild\tGOOS=linux$' "dist/$name/build-info.txt"
          grep -qP '^\tbuild\tGOARCH=${{ inputs.arch }}$' "dist/$name/build-info.txt"
          grep -qP "^\tbuild\tvcs.revision=$(git rev-parse HEAD)$" "dist/$name/build-info.txt"
          git rev-parse HEAD > "dist/$name/masque-source-commit.txt"
          cp go.mod go.sum "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v7
        with:
          name: caddy-masque-cloudflare-linux-${{ inputs.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
