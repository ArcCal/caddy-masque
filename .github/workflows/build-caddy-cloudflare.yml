name: Build Caddy with MASQUE and Cloudflare

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Linux CPU architecture
        type: choice
        required: true
        default: amd64
        options:
          - amd64
          - arm64

      source_ref:
        description: Source branch, tag or commit (empty uses the selected workflow ref)
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build Linux ${{ inputs.arch }}
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          path: source
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false

      - name: Test source and static checks
        working-directory: source
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '1'
        run: |
          go mod download
          go mod verify
          go vet ./...
          go test -race -count=1 ./...

      - name: Kernel networking lifecycle in an isolated namespace
        working-directory: source
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nftables
          sudo modprobe tun
          go test -c -o "$RUNNER_TEMP/hostnet.test" ./internal/hostnet
          sudo unshare --net env MASQUE_TEST_HOSTNET=1 "$RUNNER_TEMP/hostnet.test" -test.v -test.run '^TestHostNetworkLifecycle$'

      - name: Build pinned modules
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ inputs.arch }}
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          case "$GOARCH" in amd64|arm64) ;; *) echo "unsupported architecture" >&2; exit 1;; esac
          name="caddy-masque-cloudflare-linux-$GOARCH"
          mkdir build
          cd build
          go mod init caddy-custom-build
          cat > main.go <<'EOF'
          package main
          import (
              caddycmd "github.com/caddyserver/caddy/v2/cmd"
              _ "github.com/caddyserver/caddy/v2/modules/standard"
              _ "github.com/ArcCal/caddy-masque"
              _ "github.com/caddy-dns/cloudflare"
          )
          func main() { caddycmd.Main() }
          EOF
          go mod edit -require=github.com/ArcCal/caddy-masque@v0.0.0 -replace=github.com/ArcCal/caddy-masque=../source
          caddy_version=$(cd ../source && go list -m -f '{{.Version}}' github.com/caddyserver/caddy/v2)
          go get "github.com/caddyserver/caddy/v2@$caddy_version" github.com/caddy-dns/cloudflare@a8737d095ad5a48ca031cea6ab704057dbc2d250
          go mod tidy
          go mod verify
          go test github.com/caddy-dns/cloudflare
          mkdir -p dist/${name}
          go build -mod=readonly -buildvcs=false -trimpath -ldflags '-s -w' -o dist/${name}/caddy .
          binary=dist/${name}/caddy
          "$binary" version
          "$binary" list-modules > modules.txt
          for module in masque http.handlers.masque dns.providers.cloudflare; do
            grep -Fx "$module" modules.txt
          done
          bash ../source/tests/cloudflare-config.sh "$PWD/$binary"
          go version -m "$binary" > dist/${name}/build-info.txt
          git -C ../source rev-parse HEAD > dist/${name}/masque-source-commit.txt
          cp go.mod go.sum dist/${name}/
          cd dist
          tar -czf ${name}.tar.gz ${name}
          sha256sum ${name}.tar.gz > ${name}.tar.gz.sha256

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v7
        with:
          name: caddy-masque-cloudflare-linux-${{ inputs.arch }}
          path: |
            build/dist/*.tar.gz
            build/dist/*.sha256
          if-no-files-found: error
          retention-days: 30
