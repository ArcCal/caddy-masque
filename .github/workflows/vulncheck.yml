# Known vulnerabilities in the code this module actually calls, in its
# dependencies (Caddy, quic-go, ...) and in the Go standard library, checked
# against the Go vulnerability database. Runs on changes and weekly: a new
# advisory for an old dependency shows up without a push.
name: vulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          # The newest patch release of the line go.mod asks for: it carries the
          # standard library security fixes (go.mod says 1.26.0, the first release).
          go-version: "1.26"
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # Local replacements have no version of their own. Also query the
      # recorded upstream pins instead of relying only on the source scan.
      - run: python3 tests/verify-http2-fork.py
      - run: python3 tests/verify-http3-fork.py
      - run: python3 tests/check-transport-vulnerabilities.py
      - run: python3 tests/test-http2-security.py
